server.port=${PORT:8081}
spring.application.name=TalentPredict

# Charge un fichier .env local (format clé=valeur) si présent à la racine backend/
spring.config.import=optional:file:.env[.properties]

# ===================================================================
# Configuration PostgreSQL
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_academique}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# Configuration JPA/Hibernate
# ===================================================================
# The database schema is managed manually via SQL migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# ===================================================================
# Configuration JWT
# ===================================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}

spring.web.resources.static-locations=file:${UPLOADS_PATH:./uploads/},classpath:/static/
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:5MB}

# ===================================================================
# Paiements / Reçus
# ===================================================================
openrouter.api.key=${OPENROUTER_API_KEY:}
file.upload.path=${RECEIPTS_UPLOAD_PATH:uploads/receipts}
file.max.size=${FILE_MAX_SIZE:5242880}

# ===================================================================
# Configuration SMTP (Gmail)
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# URL frontend utilisée dans le lien de réinitialisation envoyé par email
app.reset-password-url=${APP_RESET_PASSWORD_URL:http://localhost:3000/reset-password}
app.cors.origin=${APP_CORS_ORIGIN:http://localhost:3000}

# Variables à définir via l'environnement (App Password Google, pas le mot de passe Gmail)
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
